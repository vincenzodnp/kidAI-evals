# Test cases: one photo each, with the ground truth.
# Images live in data/images/ (JPEG). Only commit photos you own and that show no identifiable people.
#
# expect: identify       -> the model should name the subject (or an alias) with "alta" confidence
#         not_confident  -> the model should NOT answer "alta" (ambiguous shots, people, no clear subject)
# kind:   standard | adversarial
#
# position: approximate coordinates (4 decimals) of the subject, passed to the model as where the photo
# was taken. The photos themselves carry no GPS metadata. Most not_confident cases have no position,
# so the coordinates cannot give the answer away.

cases:
  # --- Croatia and Sicily ---

  - id: plitvice-lake
    image: IMG_20240828_102542.jpg
    subject: Laghi di Plitvice
    aliases: [Plitvice, Plitvice Lakes, Plitvička jezera, Jezero Kozjak]
    position: {lat: 44.8833, lon: 15.6000}
    notes: A generic lake on its own; only the position makes it identifiable.

  - id: etna
    image: IMG_20240922_120350.jpg
    subject: Etna
    aliases: [Monte Etna, Mongibello, Mount Etna]
    position: {lat: 37.7510, lon: 14.9934}

