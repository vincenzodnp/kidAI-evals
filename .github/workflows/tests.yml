name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Dry run with the fake provider (no API keys)
        run: kidai-evals run --provider fake --model fake-1 --out /tmp/results && kidai-evals report --results /tmp/results
