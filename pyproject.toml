[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidai-evals"
version = "0.1.0"
description = "Evaluation harness for KidAI, a family audio-guide app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "anthropic>=0.40", "google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kidai-evals = "kidai_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
